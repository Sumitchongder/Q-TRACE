[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrace"
version = "0.1.0"
description = "Physics-informed quantum machine learning for zero-day threat detection in practical QKD"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Q-TRACE Project Contributors" }
]
keywords = [
    "quantum key distribution",
    "quantum machine learning",
    "anomaly detection",
    "implementation security",
    "zero-day detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/Q-TRACE"
Repository = "https://github.com/YOUR_USERNAME/Q-TRACE"
Changelog = "https://github.com/YOUR_USERNAME/Q-TRACE/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["qkd_simulator*", "attacks*", "models*", "quantum*", "evaluation*", "dataset*"]

[tool.flake8]
max-line-length = 100
select = ["E9", "F63", "F7", "F82"]
exclude = [".git", "__pycache__", "dataset", "results*", "figures", "notebooks"]
